spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: project
  mail:
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  datasource:
    url: jdbc:mysql://localhost:3306/project
    username: root
    password: password

  jpa:
    show-sql: true
    generate-ddl: true
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
# SMTP credentials are supplied through environment variables.
# Set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, MAIL_SMTP_AUTH and MAIL_SMTP_STARTTLS_ENABLE.
app:
  auth:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    mail-from: ${MAIL_FROM:no-reply@example.com}
