spring:
  datasource:
    url: jdbc:mysql://localhost:3306/project?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true
    username: root
    password: password

  jpa:
    # 영속성 엔티티 프론트단에 넘기지 않고 사용
    open-in-view: false
    hibernate:
      # update: 기존 테이블을 유지하면서 변경된 사항만 반영
      ddl-auto: update
    # sql을 콘솔에 출력
    show-sql: true
    properties:
      hibernate:
        # sql을 보기 좋게 출력
        format_sql: true