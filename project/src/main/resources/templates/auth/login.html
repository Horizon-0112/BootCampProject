<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>로그인</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/auth/auth-base.css}">
<link rel="stylesheet" th:href="@{/css/auth/login.css}">
</head>
<body>
<div th:replace="~{common/header :: header}"></div>
<main class="login-container"><div class="login-box">
<h1 class="login-title">로그인</h1>
<p class="login-sub">로그인하고 내 냉장고 재료에 맞는 레시피를 추천받아 보세요.</p>
<p class="form-success" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
<p class="form-success" th:if="${param.reset}">비밀번호가 변경되었습니다. 로그인해 주세요.</p>
<p class="form-success" th:if="${param.logout}">로그아웃되었습니다.</p>
<p class="form-success" th:if="${param.withdrawn}">회원 탈퇴가 완료되었습니다.</p>
<form class="auth-form" data-auth-form th:action="@{/api/v1/auth/login}" method="post" novalidate>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-row">
<label for="email">이메일</label>
<input id="email" name="email" type="email" autocomplete="email" maxlength="50" required aria-describedby="emailError">
<p id="emailError" class="field-error" data-error-for="email" aria-live="polite"></p>
</div><div class="form-row">
<label for="pw">비밀번호</label>
<input id="pw" name="pw" type="password" autocomplete="current-password"  required aria-describedby="pwError">
<p id="pwError" class="field-error" data-error-for="pw" aria-live="polite"></p>
</div>
<p class="form-message" role="alert" aria-live="polite"></p>
<button type="submit" class="btn-submit">로그인</button>
</form>
<div class="auth-footer"><a th:href="@{/auth/password/forgot}">비밀번호 찾기</a> · <a th:href="@{/auth/sign-up}">회원가입</a></div>
</div></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
