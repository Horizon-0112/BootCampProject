<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>비밀번호 재설정</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/auth/auth-base.css}">
<link rel="stylesheet" th:href="@{/css/auth/password-reset.css}">
</head>
<body>
<div th:replace="~{common/header :: header}"></div>
<main class="login-container"><div class="login-box">
<h1 class="login-title">비밀번호 재설정</h1>
<p class="login-sub">새 비밀번호는 공백 없이 영문, 숫자, 특수문자를 포함한 8~20자로 입력해 주세요.</p>

<form class="auth-form" data-auth-form th:action="@{/api/v1/auth/password/reset}" method="post" novalidate>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="token"><p class="field-error" data-error-for="token" role="alert"></p><div class="form-row">
<label for="pw">비밀번호</label>
<input id="pw" name="pw" type="password" autocomplete="new-password" maxlength="20" required aria-describedby="pwError">
<p id="pwError" class="field-error" data-error-for="pw" aria-live="polite"></p>
</div><div class="form-row">
<label for="pwConfirm">비밀번호 확인</label>
<input id="pwConfirm" name="pwConfirm" type="password" autocomplete="new-password" maxlength="20" required aria-describedby="pwConfirmError">
<p id="pwConfirmError" class="field-error" data-error-for="pwConfirm" aria-live="polite"></p>
</div>
<p class="form-message" role="alert" aria-live="polite"></p>
<button type="submit" class="btn-submit">비밀번호 재설정</button>
</form>
<div class="auth-footer"><a th:href="@{/auth/password/forgot}">재설정 링크 다시 받기</a> · <a th:href="@{/auth/login}">로그인</a></div>
</div></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
