<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>비밀번호 찾기</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/auth/auth-base.css}">
<link rel="stylesheet" th:href="@{/css/auth/password-forgot.css}">
</head>
<body>
<div th:replace="~{common/header :: header}"></div>
<main class="login-container"><div class="login-box">
<h1 class="login-title">비밀번호 찾기</h1>
<p class="login-sub">가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>

<form class="auth-form" data-auth-form th:action="@{/api/v1/auth/password/forgot}" method="post" novalidate>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-row">
<label for="email">이메일</label>
<input id="email" name="email" type="email" autocomplete="email" maxlength="50" required aria-describedby="emailError">
<p id="emailError" class="field-error" data-error-for="email" aria-live="polite"></p>
</div>
<p class="form-message" role="alert" aria-live="polite"></p>
<button type="submit" class="btn-submit">비밀번호 찾기</button>
</form>
<div class="auth-footer"><a th:href="@{/auth/login}">로그인으로 돌아가기</a></div>
</div></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
