<div th:fragment="header" class="header-container">
        <script th:src="@{/js/auth/auth-form.js}" defer></script>
        <h1 class="header-logo"><a href="/">자취생요리</a></h1>
        <ul class="header-center">
            <li><a href="/">메인</a></li>
            <li><a href="/fridge">냉장고</a></li>
            <li><a href="/shorts">shorts</a></li>
        </ul>
        <ul class="header-right">
            <li th:if="${#authorization.expression('!isAuthenticated()')}"><a th:href="@{/auth/login}">로그인</a></li>
            <li th:if="${#authorization.expression('!isAuthenticated()')}"><a th:href="@{/auth/sign-up}">회원가입</a></li>
            <li th:if="${#authorization.expression('isAuthenticated()')}"><a th:href="@{/my-page}">마이페이지</a></li>
            <li th:if="${#authorization.expression('isAuthenticated()')}">
                <form th:action="@{/api/v1/auth/logout}" method="post" data-auth-form>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">로그아웃</button>
                    <p class="form-message" role="alert" aria-live="polite"></p>
                </form>
            </li>
        </ul>
</div>
